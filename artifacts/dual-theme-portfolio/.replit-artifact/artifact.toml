kind = "web"
previewPath = "/"
title = "Ink Portfolio"
description = "A responsive personal portfolio for a full-stack developer and creative technologist, presented as a tactile ink-and-paper editorial experience."
version = "1.0.0"
id = "artifacts/dual-theme-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22258

[services.development]
run = "pnpm --filter @workspace/dual-theme-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dual-theme-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/dual-theme-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22258"
BASE_PATH = "/"
